name: Sol0 Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 platform and tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Android unit tests and signed debug APK
        run: gradle --no-daemon --stacktrace -p android :app:testDebugUnitTest :app:assembleDebug
      - name: Validate signature, package and bundled HTML
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='jp.solzero.offline'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected INTERNET permission'
            exit 1
          fi
          unzip -p "$APK" assets/index.html | sha256sum > /tmp/embedded.sha256
          sha256sum SolZero_Chat_Offline.html > /tmp/original.sha256
          diff <(cut -d' ' -f1 /tmp/embedded.sha256) <(cut -d' ' -f1 /tmp/original.sha256)
          sha256sum "$APK"
          echo 'PASS: offline HTML bundled byte-for-byte; no Internet permission; debug APK signed'
      - uses: actions/upload-artifact@v4
        with:
          name: Sol0-v016-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Sol0-v016-Android-debug-APK
          path: android-apk
      - name: Enable KVM for hardware-accelerated emulator (required)
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          # Fail closed rather than running an unacceptably slow software AVD.
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install WebView debug test driver
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0
      - name: Validate emulator runner and browser smoke syntax
        run: |
          bash -n android/tests/emulator_runner.sh
          python -m py_compile android/tests/emulator_smoke.py
      - name: Boot Android 15 and test real offline app behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash android/tests/emulator_runner.sh

  # Android 17 API 37 compatibility adds OS coverage, NOT real phone coverage.
  # Official Android emulator requires >=4GiB RAM for Android 17 AVDs.
  emulator-android17-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/integrate-atomic-import-and-local-models-20261109'
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Sol0-v016-Android-debug-APK
          path: android-apk
      - name: Enable KVM for Android 17 emulator
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install WebView debug test driver
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0
      - name: Validate test runner syntax
        run: |
          bash -n android/tests/emulator_runner.sh
          python -m py_compile android/tests/emulator_smoke.py
      - name: Boot Android 17 API 37 and run same offline WebView regression
        shell: bash
        env:
          EXPECTED_ANDROID_API: '37'
          ANDROID_SERIAL: emulator-5554
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          test -x "$sdk_tools/sdkmanager" || sdk_tools="$ANDROID_HOME/cmdline-tools/16.0/bin"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          image='system-images;android-37.2;google_apis_ps16k;x86_64'
          (set +o pipefail; yes | "$sdk_tools/sdkmanager" --licenses >/dev/null)
          "$sdk_tools/sdkmanager" --install "$image" --channel=3

          work="$(mktemp -d "$RUNNER_TEMP/sol0-api37.XXXXXX")"
          curl --fail --silent --show-error --retry 3 -o "$work/emulator.zip" \
            https://dl.google.com/android/repository/emulator-linux_x64-15917651.zip
          unzip -q "$work/emulator.zip" -d "$work"
          export ANDROID_AVD_HOME="$work/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$sdk_tools/avdmanager" create avd \
            --name sol0-api37 --package "$image" --device pixel_6
          printf '\nhw.cpu.ncore=2\nhw.ramSize=4096M\ndisk.dataPartition.size=6144M\n' \
            >> "$ANDROID_AVD_HOME/sol0-api37.avd/config.ini"

          adb start-server
          "$work/emulator/emulator" -port 5554 -avd sol0-api37 \
            -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim \
            >"$work/emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            local status=$?
            if (( status != 0 )); then tail -n 100 "$work/emulator.log"; fi
            timeout 15s adb emu kill || kill "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          # API 37 can set sys.boot_completed before these services answer ADB.
          deadline=$((SECONDS + 900))
          until [[ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]] &&
            timeout 10s adb shell '
              cmd package path android &&
              input keyevent 82 &&
              settings put global window_animation_scale 0 &&
              settings put global transition_animation_scale 0 &&
              settings put global animator_duration_scale 0
            ' >/dev/null 2>&1; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Android 17 emulator exited during boot'
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo 'Timed out waiting for Android 17 package, input and settings services'
              exit 1
            fi
            sleep 2
          done
          bash android/tests/emulator_runner.sh
