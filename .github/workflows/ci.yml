name: Sol0 Offline CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript regression (including actual Python/JS generation)
        run: node --test tests/*.test.mjs
      - name: Python syntax validation
        run: python -m compileall -q solzero training scripts tools
      - name: Python 4-bit weight-store regression (no pretrained models)
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_weight_store.py
      - name: Build single-file offline HTML
        run: python scripts/build_standalone.py
      - name: Assert offline bundle contains code and media engines
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('SolZero_Chat_Offline.html').read_text(encoding='utf-8')
          for token in ('function runTaskPlan(', 'function generateWSPCode(', 'function generateCode(', 'class MediaStudio', 'class SolZeroEngine', 'v0.16'):
              assert token in s, token
          assert '<script type="module" src="./app.js"></script>' not in s
          print('Standalone offline bundle verified:', len(s.encode('utf-8')), 'bytes')
          PY
      - name: Validate bundled JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('SolZero_Chat_Offline.html').read_text(encoding='utf-8')
          tag='<script type="module">'
          assert html.count(tag)==1
          Path('/tmp/sol0-standalone.mjs').write_text(html.split(tag,1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/sol0-standalone.mjs
      - name: Assert committed offline HTML matches source build
        run: git diff --exit-code -- SolZero_Chat_Offline.html
      - uses: actions/upload-artifact@v4
        with:
          name: Sol0-v016-offline-HTML
          path: SolZero_Chat_Offline.html
          if-no-files-found: error
 
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Mobile-size chat + inductive WSP regression
        run: python scripts/browser_induction_smoke.py
      - name: Mobile-size PNG/WAV/GIF/WebM and ZIP regression
        run: python scripts/browser_media_smoke.py
      - name: Mobile-size multi-step task workbench and media consent regression
        run: python scripts/browser_task_agent_smoke.py
      - name: Multiline input and explicit send regression
        run: python scripts/browser_input_smoke.py
      - name: Opt-in LLM UI and per-message consent (mock network)
        run: python scripts/browser_model_smoke.py

  # Explicit feature-branch trial: real official Qwen model is downloaded only
  # to the ephemeral CI runner, verified by SHA256, and never uploaded/artifacted.
  # Not a required job for ordinary Sol0 or Android PRs.
  qwen-real-e2e:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/kimi-local-vllm-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned llama.cpp CPU server without downloader
        run: |
          git clone --depth 1 --branch b12135 https://github.com/ggml-org/llama.cpp.git /tmp/sol0-llama
          cmake -S /tmp/sol0-llama -B /tmp/sol0-llama-build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF
          cmake --build /tmp/sol0-llama-build --target llama-server --parallel 2
      - name: Download official Qwen3-0.6B Q8 model, verify source SHA256
        run: |
          curl --fail --location --retry 3 --max-time 600 --output /tmp/sol0-qwen.gguf \
            https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
          echo '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031  /tmp/sol0-qwen.gguf' | sha256sum --check
      - name: Slice real Qwen weights into 8MiB byte chunks, reassemble and verify SHA256
        run: |
          node tools/model_chunks.mjs split \
            --input=/tmp/sol0-qwen.gguf \
            --out=/tmp/sol0-qwen-parts \
            --chunk-bytes=8388608
          node tools/model_chunks.mjs join \
            --manifest=/tmp/sol0-qwen-parts/manifest.json \
            --out=/tmp/sol0-qwen-restored.gguf
          echo '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031  /tmp/sol0-qwen-restored.gguf' | sha256sum --check
          cmp /tmp/sol0-qwen.gguf /tmp/sol0-qwen-restored.gguf
          echo 'Original GGUF and reconstructed byte chunks are identical'
      - name: Generate a real Qwen response through Sol0 consent-gated adapter
        run: |
          node tools/qwen_local.mjs --model=/tmp/sol0-qwen-restored.gguf \
            --runner=/tmp/sol0-llama-build/bin/llama-server > /tmp/sol0-qwen-server.log 2>&1 &
          model_pid=$!
          trap 'kill "$model_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 150); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:9931/health | grep -q '"status":"ok"'; then
              ready=1
              break
            fi
            if ! kill -0 "$model_pid" 2>/dev/null; then
              tail -n 100 /tmp/sol0-qwen-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 100 /tmp/sol0-qwen-server.log
            echo 'Qwen model did not become ready'
            exit 1
          fi
          node tools/local_model_smoke.mjs --consent \
            --endpoint=http://127.0.0.1:9931/v1/chat/completions \
            --model=sol0-qwen
          for case_id in ja_instruction arithmetic translation summary code source_uncertainty; do
            echo "Checking Qwen public capability case: $case_id"
            node tools/compare_model_capabilities.mjs --consent \
              --endpoint=http://127.0.0.1:9931/v1/chat/completions \
              --model=sol0-qwen --case="$case_id"
          done
          echo 'Real official Qwen inference and public capability probes finished; no weights exported.'

  # This job deliberately deletes the complete GGUF before rerunning the
  # quantized weight kernel to prove it can compute from verified chunks alone.
  # It does NOT claim to perform a full Transformer forward pass.
  qwen-lazy-tensor-e2e:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/lazy-gguf-tensor-slices-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain official Qwen GGUF with pinned digest
        run: |
          curl --fail --location --retry 3 --max-time 600 --output /tmp/sol0-lazy-qwen.gguf \
            https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
          echo '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031  /tmp/sol0-lazy-qwen.gguf' | sha256sum --check
      - name: Partition official GGUF and verify native quantized kernel
        run: |
          node tools/model_chunks.mjs split \
            --input=/tmp/sol0-lazy-qwen.gguf \
            --out=/tmp/sol0-lazy-qwen-slices \
            --chunk-bytes=8388608
          node tools/lazy_gguf_probe.mjs \
            --manifest=/tmp/sol0-lazy-qwen-slices/manifest.json \
            --expected-sha256=9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031 \
            > /tmp/sol0-lazy-first.json
          python - <<'PY'
          import json, math, struct
          with open('/tmp/sol0-lazy-first.json', encoding='utf-8') as f:
              result=json.load(f)
          with open('/tmp/sol0-lazy-qwen.gguf','rb') as f:
              f.seek(result['sourceOffset'])
              data=f.read(34)
          assert len(data)==34
          scale=struct.unpack('<e',data[:2])[0]
          weights=struct.unpack('32b',data[2:])
          reference=sum(scale*w for w in weights)
          assert math.isclose(reference,result['numericDot'],rel_tol=1e-5,abs_tol=1e-4), (reference,result)
          assert result['modelArchitecture'].startswith('qwen')
          assert result['uniqueChunksRead'] < result['chunksAvailable'], result
          assert result['diskReassembly'] is False and result['wholeModelRun'] is False
          print('Qwen quantized kernel matches independent original-file calculation:',reference)
          print('Parts touched:',result['uniqueChunksRead'],'/',result['chunksAvailable'])
          PY
      - name: Delete original complete GGUF then compute again solely from slices
        run: |
          rm /tmp/sol0-lazy-qwen.gguf
          test ! -f /tmp/sol0-lazy-qwen.gguf
          node tools/lazy_gguf_probe.mjs \
            --manifest=/tmp/sol0-lazy-qwen-slices/manifest.json \
            --expected-sha256=9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031 \
            > /tmp/sol0-lazy-no-original.json
          python - <<'PY'
          import json
          with open('/tmp/sol0-lazy-first.json',encoding='utf-8') as f:
              before=json.load(f)
          with open('/tmp/sol0-lazy-no-original.json',encoding='utf-8') as f:
              after=json.load(f)
          assert before==after,(before,after)
          assert after['uniqueChunksRead'] < after['chunksAvailable']
          print('Success: Qwen weight calculation from verified chunks with zero reconstructed model files')
          PY
