name: Sol0 weight pipeline tests

on:
  pull_request:
  push:
    branches: [main, feature/weight-staging-v1]
  workflow_dispatch:

jobs:
  weight-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependency
        run: python -m pip install pytest
      - name: Compile Python modules
        run: python -m compileall -q solzero scripts tests
      - name: Run weight pipeline tests
        run: |
          python -m pytest -q \
            tests/test_weight_store.py \
            tests/test_weight_staging.py \
            tests/test_weight_inspection.py \
            tests/test_import_kimi_weights.py \
            tests/test_plan_kimi_shards.py \
            tests/test_weight_transplant.py \
            tests/test_weight_store_f32.py \
            tests/test_weight_transplant_f32.py \
            tests/test_f32_layers.py \
            tests/test_attention_moe.py \
            tests/test_tiny_transformer.py \
            tests/test_tiny_token_model.py
